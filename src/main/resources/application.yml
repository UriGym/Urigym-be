spring:
  application:
    name: urigym-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/urigym
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  upload-dir: uploads

# Toss Payments' publicly documented sandbox secret key — safe to commit, works with
# their test-mode confirm API without a real merchant account. Replace with a live
# secret key (via env var) before accepting real payments.
toss:
  secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}

jwt:
  secret: urigym-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24 hours in milliseconds

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.urigym: DEBUG
    org.hibernate.SQL: DEBUG
